<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Restaurant Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-8" x-data="leadsApp()">

    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">NYC Restaurant Leads <span class="text-sm font-normal text-gray-500" x-text="'(' + leads.length + ' found)'"></span></h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="lead in leads" :key="lead.id">
                <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition cursor-pointer" @click="openModal(lead)">
                    <div class="flex justify-between items-start">
                        <h2 class="text-xl font-semibold text-gray-800" x-text="lead.restaurant_name"></h2>
                    </div>
                    <p class="text-gray-600 mt-2 text-sm" x-text="lead.address"></p>
                    <p class="text-blue-600 mt-1 text-sm font-medium" x-show="lead.phone" x-text="'📞 ' + lead.phone"></p>
                    <div class="mt-4 flex items-center text-sm text-gray-500">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        <span x-text="lead.phone || 'N/A'"></span>
                    </div>
                    <div class="mt-2 flex items-center text-sm text-gray-500">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span x-text="'Hours: ' + lead.hours"></span>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Modal -->
    <div x-show="activeLead" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity" aria-hidden="true" @click="activeLead = null">
                <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
            </div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full" @click.stop>
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4" x-if="activeLead">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-2xl leading-6 font-medium text-gray-900" x-text="activeLead.restaurant_name"></h3>
                            <div class="mt-4 grid grid-cols-2 gap-4 text-sm">
                                <div>
                                    <p class="font-bold text-gray-700">Details</p>
                                    <p><strong>Address:</strong> <span x-text="activeLead.address"></span></p>
                                    <p><strong>Phone:</strong> <span x-text="activeLead.phone"></span></p>
                                    <p><strong>Website:</strong> <a :href="activeLead.website" target="_blank" class="text-blue-600 hover:underline" x-text="activeLead.website"></a></p>
                                    <p><strong>Hours:</strong> <span x-text="activeLead.hours"></span></p>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-700">Menu Highlights</p>
                                    <ul class="list-disc list-inside text-gray-600">
                                        <template x-for="item in activeLead.menu_items">
                                            <li x-text="item"></li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                            
                            <div class="mt-6">
                                <label class="block text-sm font-medium text-gray-700">Personalized Email Draft</label>
                                <div class="mt-1 relative rounded-md shadow-sm">
                                    <textarea id="emailContent" rows="10" class="w-full shadow-sm focus:ring-blue-500 focus:border-blue-500 block sm:text-sm border-gray-300 rounded-md p-2 bg-gray-50 font-mono text-xs" x-model="activeLead.email_content" readonly></textarea>
                                </div>
                                <button @click="copyEmail()" class="mt-2 inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                    Copy Email
                                </button>
                                <span x-show="copied" class="ml-2 text-sm text-green-600" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-300" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">Copied!</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm" @click="activeLead = null">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function leadsApp() {
            return {
                leads: [],
                activeLead: null,
                copied: false,
                async init() {
                    const response = await fetch('leads.json');
                    this.leads = await response.json();
                },
                openModal(lead) {
                    this.activeLead = lead;
                    this.copied = false;
                },
                copyEmail() {
                    const el = document.getElementById('emailContent');
                    el.select();
                    document.execCommand('copy');
                    this.copied = true;
                    setTimeout(() => this.copied = false, 2000);
                }
            }
        }
    </script>
</body>
</html>
